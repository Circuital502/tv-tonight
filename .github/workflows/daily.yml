name: Update TV listings

on:
  schedule:
    - cron: "0 10 * * *"   # 10:00 UTC = about 6 AM Eastern (5 AM in winter)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build page
        run: python generate_page.py
      - name: Save changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Update listings" && git push)
